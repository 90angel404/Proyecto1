<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rompecabezas Aritmético Avanzado</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #f5f7fa;
            color: #333;
        }
        .puzzle-container {
            max-width: 600px;
            margin: 30px auto;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .difficulty-selector {
            margin: 20px 0;
        }
        .difficulty-btn {
            padding: 8px 15px;
            margin: 0 5px;
            background-color: #ecf0f1;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .difficulty-btn.active {
            background-color: #3498db;
            color: white;
        }
        .equation {
            font-size: 28px;
            margin: 30px 0;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 10px;
            min-height: 50px;
        }
        .empty-slot {
            display: inline-block;
            width: 80px;
            height: 50px;
            border: 2px dashed #95a5a6;
            border-radius: 5px;
            margin: 0 5px;
            vertical-align: middle;
            line-height: 50px;
            font-size: 24px;
            color: #2c3e50;
        }
        .options {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: 30px 0;
        }
        .option {
            width: 80px;
            height: 60px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 3px 5px rgba(0,0,0,0.1);
        }
        .option:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 5px 8px rgba(0,0,0,0.15);
        }
        .feedback {
            margin: 25px 0;
            font-size: 20px;
            min-height: 30px;
            font-weight: bold;
        }
        .correct {
            color: #27ae60;
        }
        .incorrect {
            color: #e74c3c;
        }
        .controls {
            margin-top: 20px;
        }
        .btn {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.3s;
            box-shadow: 0 3px 5px rgba(0,0,0,0.1);
        }
        .btn:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 5px 8px rgba(0,0,0,0.15);
        }
        .btn-secondary {
            background-color: #95a5a6;
        }
        .btn-secondary:hover {
            background-color: #7f8c8d;
        }
        .explanation {
            margin-top: 30px;
            padding: 15px;
            background-color: #e8f4f8;
            border-radius: 8px;
            text-align: left;
            display: none;
        }
    </style>
</head>
<body>
    <div class="puzzle-container">
        <h1>Rompecabezas Aritmético Avanzado</h1>
        <p>Resuelve problemas matemáticos desafiantes seleccionando la respuesta correcta</p>
        
        <div class="difficulty-selector">
            <button class="difficulty-btn active" data-level="medium">Intermedio</button>
            <button class="difficulty-btn" data-level="hard">Avanzado</button>
            <button class="difficulty-btn" data-level="expert">Experto</button>
        </div>
        
        <div class="equation" id="equation">
            <!-- La ecuación se generará dinámicamente -->
        </div>
        
        <div class="options" id="options">
            <!-- Las opciones se generarán dinámicamente -->
        </div>
        
        <div class="feedback" id="feedback"></div>
        
        <div class="explanation" id="explanation"></div>
        
        <div class="controls">
            <button class="btn" id="check-btn">Verificar</button>
            <button class="btn btn-secondary" id="next-btn">Siguiente</button>
            <button class="btn btn-secondary" id="hint-btn">Pista</button>
            <button class="btn btn-secondary" id="solution-btn">Solución</button>
        </div>
    </div>

    <script>
        // Variables del juego
        let currentAnswer = 0;
        let selectedOption = null;
        let currentDifficulty = 'medium';
        let currentProblem = {};
        let hintsGiven = 0;
        
        // Elementos del DOM
        const equationElement = document.getElementById('equation');
        const optionsContainer = document.getElementById('options');
        const feedbackElement = document.getElementById('feedback');
        const explanationElement = document.getElementById('explanation');
        const checkBtn = document.getElementById('check-btn');
        const nextBtn = document.getElementById('next-btn');
        const hintBtn = document.getElementById('hint-btn');
        const solutionBtn = document.getElementById('solution-btn');
        const difficultyBtns = document.querySelectorAll('.difficulty-btn');
        
        // Configuración de dificultad
        const difficultySettings = {
            medium: {
                minNumber: 1,
                maxNumber: 20,
                decimals: 0,
                operations: ['+', '-', '×', '÷'],
                multiStepProbability: 0.3
            },
            hard: {
                minNumber: 1,
                maxNumber: 50,
                decimals: 1,
                operations: ['+', '-', '×', '÷', '%'],
                multiStepProbability: 0.6
            },
            expert: {
                minNumber: -20,
                maxNumber: 100,
                decimals: 2,
                operations: ['+', '-', '×', '÷', '%', '²', '√'],
                multiStepProbability: 0.9
            }
        };
        
        // Event listeners para los botones de dificultad
        difficultyBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                difficultyBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentDifficulty = btn.dataset.level;
                generateProblem();
            });
        });
        
        // Generar un número aleatorio según la dificultad
        function getRandomNumber() {
            const settings = difficultySettings[currentDifficulty];
            let number = settings.minNumber + Math.random() * (settings.maxNumber - settings.minNumber);
            
            if (settings.decimals > 0) {
                number = parseFloat(number.toFixed(settings.decimals));
            } else {
                number = Math.floor(number);
            }
            
            return number;
        }
        
        // Generar un problema matemático
        function generateProblem() {
            // Reiniciar variables
            selectedOption = null;
            hintsGiven = 0;
            explanationElement.style.display = 'none';
            explanationElement.innerHTML = '';
            feedbackElement.innerHTML = '';
            feedbackElement.className = 'feedback';
            
            const settings = difficultySettings[currentDifficulty];
            const isMultiStep = Math.random() < settings.multiStepProbability;
            
            if (isMultiStep) {
                currentProblem = generateMultiStepProblem();
            } else {
                currentProblem = generateSingleStepProblem();
            }
            
            // Mostrar la ecuación
            displayEquation(currentProblem);
            
            // Generar opciones de respuesta
            generateOptions(currentProblem.answer);
        }
        
        // Generar problema de un solo paso
        function generateSingleStepProblem() {
            const settings = difficultySettings[currentDifficulty];
            const num1 = getRandomNumber();
            const num2 = getRandomNumber();
            const operator = settings.operations[Math.floor(Math.random() * settings.operations.length)];
            
            let answer, equationParts;
            
            switch(operator) {
                case '+':
                    answer = num1 + num2;
                    equationParts = [`${num1} + ${num2} = `];
                    break;
                case '-':
                    answer = num1 - num2;
                    equationParts = [`${num1} - ${num2} = `];
                    break;
                case '×':
                    answer = num1 * num2;
                    equationParts = [`${num1} × ${num2} = `];
                    break;
                case '÷':
                    // Asegurar división válida
                    if (num2 === 0) return generateSingleStepProblem();
                    answer = num1 / num2;
                    if (settings.decimals > 0) {
                        answer = parseFloat(answer.toFixed(settings.decimals));
                    } else {
                        if (num1 % num2 !== 0) return generateSingleStepProblem();
                        answer = num1 / num2;
                    }
                    equationParts = [`${num1} ÷ ${num2} = `];
                    break;
                case '%':
                    answer = num1 * num2 / 100;
                    if (settings.decimals > 0) {
                        answer = parseFloat(answer.toFixed(settings.decimals));
                    } else {
                        answer = Math.round(answer);
                    }
                    equationParts = [`${num1}% de ${num2} = `];
                    break;
                case '²':
                    answer = num1 * num1;
                    equationParts = [`${num1}² = `];
                    break;
                case '√':
                    if (num1 < 0) return generateSingleStepProblem();
                    answer = Math.sqrt(num1);
                    if (settings.decimals > 0) {
                        answer = parseFloat(answer.toFixed(settings.decimals));
                    } else {
                        if (!Number.isInteger(answer)) return generateSingleStepProblem();
                    }
                    equationParts = [`√${num1} = `];
                    break;
            }
            
            return {
                type: 'single',
                equationParts,
                answer,
                explanation: `Para resolver ${equationParts[0]}${answer}, simplemente realizamos la operación ${operator} entre los números.`
            };
        }
        
        // Generar problema de múltiples pasos
        function generateMultiStepProblem() {
            const settings = difficultySettings[currentDifficulty];
            const num1 = getRandomNumber();
            const num2 = getRandomNumber();
            const num3 = getRandomNumber();
            
            // Elegir un tipo de problema multi-paso
            const problemTypes = [
                'parentheses',
                'combined',
                'percentage',
                'fraction',
                'exponents'
            ];
            
            const selectedType = problemTypes[Math.floor(Math.random() * problemTypes.length)];
            
            let answer, equationParts, explanation;
            
            switch(selectedType) {
                case 'parentheses':
                    answer = (num1 + num2) * num3;
                    equationParts = [`( ${num1} + ${num2} ) × ${num3} = `];
                    explanation = `Primero resolvemos el paréntesis: ${num1} + ${num2} = ${num1+num2}. Luego multiplicamos por ${num3}: ${num1+num2} × ${num3} = ${answer}.`;
                    break;
                case 'combined':
                    answer = num1 * num2 + num3;
                    equationParts = [`${num1} × ${num2} + ${num3} = `];
                    explanation = `Primero multiplicamos ${num1} × ${num2} = ${num1*num2}. Luego sumamos ${num3}: ${num1*num2} + ${num3} = ${answer}.`;
                    break;
                case 'percentage':
                    const percentage = num1;
                    const total = num2;
                    const discount = num3;
                    answer = total * (1 - percentage/100) - discount;
                    if (settings.decimals > 0) {
                        answer = parseFloat(answer.toFixed(settings.decimals));
                    }
                    equationParts = [`${total} - ${percentage}% - ${discount} = `];
                    explanation = `Primero calculamos el ${percentage}% de ${total}: ${total} × ${percentage/100} = ${total*(percentage/100)}. Restamos esto de ${total}: ${total} - ${total*(percentage/100)} = ${total*(1-percentage/100)}. Finalmente restamos ${discount}: ${total*(1-percentage/100)} - ${discount} = ${answer}.`;
                    break;
                case 'fraction':
                    answer = (num1 / num2) * num3;
                    if (settings.decimals > 0) {
                        answer = parseFloat(answer.toFixed(settings.decimals));
                    }
                    equationParts = [`( ${num1} ÷ ${num2} ) × ${num3} = `];
                    explanation = `Primero dividimos ${num1} ÷ ${num2} = ${num1/num2}. Luego multiplicamos por ${num3}: ${num1/num2} × ${num3} = ${answer}.`;
                    break;
                case 'exponents':
                    answer = Math.pow(num1, 2) + Math.pow(num2, 2);
                    equationParts = [`${num1}² + ${num2}² = `];
                    explanation = `Primero calculamos ${num1}² = ${Math.pow(num1,2)} y ${num2}² = ${Math.pow(num2,2)}. Luego sumamos: ${Math.pow(num1,2)} + ${Math.pow(num2,2)} = ${answer}.`;
                    break;
            }
            
            return {
                type: 'multi',
                equationParts,
                answer,
                explanation
            };
        }
        
        // Mostrar la ecuación en el DOM
        function displayEquation(problem) {
            equationElement.innerHTML = '';
            
            problem.equationParts.forEach(part => {
                const span = document.createElement('span');
                span.textContent = part;
                equationElement.appendChild(span);
            });
            
            const emptySlot = document.createElement('div');
            emptySlot.className = 'empty-slot';
            emptySlot.id = 'result-slot';
            equationElement.appendChild(emptySlot);
        }
        
        // Generar opciones de respuesta
        function generateOptions(correctAnswer) {
            optionsContainer.innerHTML = '';
            const settings = difficultySettings[currentDifficulty];
            const options = [correctAnswer];
            
            // Generar opciones incorrectas
            while(options.length < 5) {
                let randomOption;
                
                if (settings.decimals > 0) {
                    // Para dificultades con decimales
                    const variation = 0.1 + Math.random() * 0.9;
                    randomOption = correctAnswer * (Math.random() > 0.5 ? (1 + variation) : (1 - variation));
                    randomOption = parseFloat(randomOption.toFixed(settings.decimals));
                } else {
                    // Para números enteros
                    randomOption = correctAnswer + (Math.floor(Math.random() * 5) + 1) * (Math.random() > 0.5 ? 1 : -1);
                }
                
                // Asegurarse de que la opción no sea igual a la correcta y no se repita
                if (randomOption !== correctAnswer && !options.includes(randomOption)) {
                    options.push(randomOption);
                }
            }
            
            // Mezclar las opciones
            options.sort(() => Math.random() - 0.5);
            
            // Crear botones para cada opción
            options.forEach(option => {
                const optionBtn = document.createElement('div');
                optionBtn.className = 'option';
                optionBtn.textContent = option;
                optionBtn.addEventListener('click', () => {
                    // Deseleccionar la opción anterior si existe
                    if (selectedOption) {
                        selectedOption.style.backgroundColor = '#3498db';
                    }
                    
                    // Seleccionar la nueva opción
                    selectedOption = optionBtn;
                    selectedOption.style.backgroundColor = '#e67e22';
                    
                    // Mostrar la selección en el espacio vacío
                    document.getElementById('result-slot').textContent = option;
                });
                optionsContainer.appendChild(optionBtn);
            });
        }
        
        // Verificar la respuesta seleccionada
        function checkAnswer() {
            if (!selectedOption) {
                feedbackElement.textContent = 'Por favor selecciona una respuesta';
                feedbackElement.className = 'feedback incorrect';
                return;
            }
            
            const selectedAnswer = parseFloat(selectedOption.textContent);
            const isCorrect = Math.abs(selectedAnswer - currentProblem.answer) < 0.0001; // Para manejar decimales
            
            if (isCorrect) {
                feedbackElement.textContent = '¡Correcto! Respuesta exacta.';
                feedbackElement.className = 'feedback correct';
                selectedOption.style.backgroundColor = '#27ae60';
            } else {
                feedbackElement.textContent = `Incorrecto. La respuesta correcta es ${currentProblem.answer}.`;
                feedbackElement.className = 'feedback incorrect';
                selectedOption.style.backgroundColor = '#e74c3c';
            }
            
            // Mostrar explicación
            explanationElement.innerHTML = `<strong>Explicación:</strong> ${currentProblem.explanation}`;
            explanationElement.style.display = 'block';
        }
        
        // Mostrar una pista
        function showHint() {
            if (hintsGiven >= 2) {
                feedbackElement.textContent = 'No hay más pistas disponibles';
                feedbackElement.className = 'feedback';
                return;
            }
            
            hintsGiven++;
            
            if (hintsGiven === 1) {
                // Primera pista: rango de la respuesta
                const min = currentProblem.answer * 0.8;
                const max = currentProblem.answer * 1.2;
                feedbackElement.textContent = `Pista: La respuesta está entre ${min.toFixed(2)} y ${max.toFixed(2)}`;
                feedbackElement.className = 'feedback';
            } else if (hintsGiven === 2) {
                // Segunda pista: primer paso de la solución
                const firstStep = currentProblem.explanation.split('.')[0];
                feedbackElement.textContent = `Pista: ${firstStep}`;
                feedbackElement.className = 'feedback';
            }
        }
        
        // Mostrar la solución completa
        function showSolution() {
            feedbackElement.textContent = `Solución: ${currentProblem.answer}`;
            feedbackElement.className = 'feedback correct';
            explanationElement.innerHTML = `<strong>Explicación completa:</strong> ${currentProblem.explanation}`;
            explanationElement.style.display = 'block';
        }
        
        // Event listeners para los botones
        checkBtn.addEventListener('click', checkAnswer);
        nextBtn.addEventListener('click', generateProblem);
        hintBtn.addEventListener('click', showHint);
        solutionBtn.addEventListener('click', showSolution);
        
        // Generar el primer problema al cargar la página
        generateProblem();
    </script>
</body>
</html>
